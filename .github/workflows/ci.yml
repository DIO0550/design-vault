name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: install / supply-chain / tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # lock の公開日検査が「lock を最後に変えたコミット」の日時を引くため、履歴をすべて取る
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm のサプライチェーン設定
        run: pnpm check:supply-chain

      # install より前に走らせ、新しすぎる版を一度も取り込まないようにする（依存なしで動く）
      - name: lock の全パッケージの公開日
        run: pnpm check:release-age

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: トークンの検証と生成
        run: pnpm build:tokens

      - name: 生成物がコミット済みのものと一致する
        run: |
          if [ -n "$(git status --porcelain -- dist plugins)" ]; then
            git status --porcelain -- dist plugins
            git diff -- dist plugins
            echo "::error::生成物が古いままです。pnpm build:tokens を実行してコミットしてください"
            exit 1
          fi

      # SKILL.md と各パターンの guide.md には値を書かず、値は tokens.json（と生成物の DESIGN.md）だけに置く（値が 2 か所にあるとずれるため）。
      # Do / Don't 表の Don't 列は直書きの悪い例として値を含むので、表の行は見ない
      - name: SKILL.md と guide.md に値が直書きされていない
        run: |
          if grep -nE '#[0-9a-fA-F]{3,8}\b|[0-9]+px' plugins/design-system/skills/design-system/SKILL.md tokens/patterns/*/guide.md | grep -vE '^[^:]+:[0-9]+:\|'; then
            echo "::error::SKILL.md か guide.md に値が書かれています。値は tokens.json に置き、トークン名で参照してください"
            exit 1
          fi

      - name: 見本サイトの型検査とビルド
        run: |
          pnpm site:typecheck
          pnpm site:build

      - name: プラグインのマニフェスト
        run: |
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' \
            .claude-plugin/marketplace.json \
            plugins/design-system/.claude-plugin/plugin.json
