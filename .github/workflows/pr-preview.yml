# PR ごとの見本ページのプレビューを gh-pages/pr-preview/pr-{番号}/ へ配置し、PR が閉じたら消す。
# (gh-pages ブランチが無ければ空の orphan として自動作成する)
# design-composer の storybook-pr-preview.yml を見本ページ向けに移植したもの。
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

# PR ごとに独立したグループにする(共有グループだと待機中の run が
# 別 PR の run に置き換えられ、closed 時の削除が消失することがある)。
# gh-pages への push 競合は更新ステップ内のリトライで吸収する
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークや Dependabot の PR では GITHUB_TOKEN が read-only になり
    # gh-pages へ push できないためスキップする
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v5.0.0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 見本ページは vite の base（/design-vault/）を前提に組まれるので、プレビューの置き場所に合わせて上書きする
      - name: Build
        if: github.event.action != 'closed'
        env:
          PR: ${{ github.event.number }}
        run: |
          pnpm install --frozen-lockfile
          pnpm site:build --base "/${GITHUB_REPOSITORY#*/}/pr-preview/pr-${PR}/"

      - name: Update gh-pages
        env:
          PR: ${{ github.event.number }}
          CLOSED: ${{ github.event.action == 'closed' }}
          OUTPUT_DIR: site/dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$CLOSED" = "true" ]; then ACTION=removed; else ACTION=updated; fi

          success=false
          for attempt in 1 2 3 4 5; do
            git worktree remove --force /tmp/gh-pages 2>/dev/null || true
            git branch -D gh-pages 2>/dev/null || true

            # gh-pages ブランチが無ければ空の orphan として作成
            if git fetch origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
              git worktree add --detach /tmp/gh-pages origin/gh-pages
            else
              git worktree add --detach /tmp/gh-pages
              git -C /tmp/gh-pages checkout --orphan gh-pages
              git -C /tmp/gh-pages rm -rf --quiet . || true
            fi

            cd /tmp/gh-pages

            rm -rf "pr-preview/pr-$PR"
            if [ "$CLOSED" != "true" ]; then
              mkdir -p "pr-preview/pr-$PR"
              cp -r "$GITHUB_WORKSPACE/$OUTPUT_DIR/." "pr-preview/pr-$PR/"
            fi
            touch .nojekyll

            git add -A
            if ! git commit -m "PR preview #$PR ($ACTION)"; then
              echo "no changes"
              success=true
              break
            fi

            # 他ワークフローの push と競合したら fetch からやり直す
            if git push origin HEAD:gh-pages; then
              success=true
              break
            fi
            echo "push failed (attempt $attempt), retrying..."
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 2))
          done
          [ "$success" = "true" ]

      - name: Comment preview URL
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          URL="https://${OWNER}.github.io/${REPO_NAME}/pr-preview/pr-${PR_NUMBER}/"

          BODY_FILE=preview-comment.md
          echo "📖 見本ページのプレビュー: [${URL}](${URL}) （パターンは \`?pattern=<名前>\` で切り替え）" > "$BODY_FILE"

          bash .github/scripts/upsert-sticky-comment.sh \
            --marker '<!-- site-preview -->' \
            --body-file "$BODY_FILE" --if-missing post
